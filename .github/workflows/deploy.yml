name: Build, Scan & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-scan-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "IMAGE_NAME=victim-app" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "NAMESPACE=demo-app" >> $GITHUB_ENV
          echo "DEPLOYMENT_NAME=victim-app" >> $GITHUB_ENV
          # Report window: last 24h, formatted for kubesentinel report --from/--to
          echo "REPORT_FROM=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "REPORT_TO=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 1. CLUSTER SETUP
      # ──────────────────────────────────────────────────────────────────────
      - name: Clean up and Start Minikube
        run: |
          echo "=== 1. Freeing up Disk Space ==="
          docker system prune -af --volumes

          echo "=== 2. Deleting old broken cluster ==="
          minikube delete

          echo "=== 3. Starting Minikube safely ==="
          minikube start --memory=2500 --cpus=2 --force

          echo "=== 4. Wait for Control Plane ==="
          kubectl wait --for=condition=Ready node/minikube --timeout=90s
          echo "Available space:"
          df -h
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 2. BUILD VICTIM APP
      # ──────────────────────────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
        shell: bash

      - name: Load image into Minikube
        run: |
          minikube image load ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          minikube image load ${{ env.IMAGE_NAME }}:latest
        shell: bash

      - name: Configure Minikube context
        run: |
          kubectl config use-context minikube
          echo "✓ Minikube context configured"
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 3. INSTALL FALCO (with Falcosidekick → KubeSentinel runtime webhook)
      # ──────────────────────────────────────────────────────────────────────
      - name: Install and Configure Falco
        run: |
          echo "=== Installing Falco via Helm ==="
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

          kubectl create namespace falco --dry-run=client -o yaml | kubectl apply -f -

          # Falcosidekick is configured to push events directly to the
          # kubesentinel-runtime HTTP endpoint (new in this KubeSentinel version).
          # This replaces the manual: kubectl logs | kubesentinel monitor-stdin
          helm upgrade --install falco falcosecurity/falco \
            --namespace falco \
            --set ebpf.enabled=true \
            --set falco.json_output=true \
            --set falco.json_include_output_property=true \
            --set falcosidekick.enabled=true \
            --set falcosidekick.config.webhook.address="http://kubesentinel-runtime.kubesentinel.svc.cluster.local:8080/events" \
            --wait \
            --timeout=5m

          echo "✓ Falco Helm install completed"

          echo "=== Waiting for Falco DaemonSet ==="
          kubectl rollout status daemonset/falco -n falco --timeout=8m

          echo "=== Verifying Falco Pod Status ==="
          kubectl get pods -n falco -l app.kubernetes.io/name=falco

          FALCO_POD=$(kubectl get pod -n falco \
            -l app.kubernetes.io/name=falco,app.kubernetes.io/instance=falco \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [ -z "$FALCO_POD" ]; then
            echo "❌ No Falco pod found after DaemonSet rollout"
            kubectl get daemonset -n falco
            kubectl get pods -n falco --show-labels
            exit 1
          fi

          echo "Falco pod: $FALCO_POD"
          sleep 5

          echo "=== Checking Falco JSON Output ==="
          if kubectl logs -n falco "$FALCO_POD" --tail=10 | grep -q '"time"'; then
            echo "✓ Falco is outputting JSON events"
          else
            echo "⚠️  Falco JSON output not detected. Debugging config:"
            echo "--- Checking falco.yaml inside pod ---"
            kubectl exec -n falco "$FALCO_POD" -- grep -A 2 'json_output' /etc/falco/falco.yaml || echo "(grep failed)"
            echo "--- Recent Falco logs ---"
            kubectl logs -n falco "$FALCO_POD" --tail=20 || true
          fi
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 4. BUILD & DEPLOY KUBESENTINEL
      # ──────────────────────────────────────────────────────────────────────
      - name: Build and Deploy KubeSentinel Components
        run: |
          echo "=== Building KubeSentinel CLI Image ==="
          cd ~/kubesentinel
          git stash || true
          git pull origin main
          docker build -f dockerfile -t kubesentinel:latest .
          minikube image load kubesentinel:latest
          echo "✓ KubeSentinel CLI image loaded"

          echo "=== Ensuring kubesentinel namespace exists ==="
          kubectl create namespace kubesentinel --dry-run=client -o yaml | kubectl apply -f -

          echo "=== Creating hostPath directories on Minikube node ==="
          minikube ssh "sudo mkdir -p /var/lib/kubesentinel/forensics && \
            sudo touch /var/lib/kubesentinel/staging.db && \
            sudo chmod 777 /var/lib/kubesentinel/forensics /var/lib/kubesentinel/staging.db"

          echo "=== Applying KubeSentinel DaemonSet ==="
          kubectl apply -f deploy/kubesentinel-daemonset.yaml
          echo "✓ KubeSentinel DaemonSet deployed"

          echo "=== Building KubeSentinel AI Image ==="
          docker build -f dockerfile.ai -t kubesentinel-ai:latest .
          minikube image load kubesentinel-ai:latest
          echo "✓ KubeSentinel AI image loaded"

          echo "=== Applying KubeSentinel AI Deployment ==="
          kubectl apply -f deploy/kubesentinel-ai-deployment.yaml
          echo "✓ KubeSentinel AI deployment manifest applied"

          echo "=== Removing resource limits to allow flexible allocation ===" 
          kubectl patch deployment kubesentinel-ai -n kubesentinel --type='json' -p='[{"op": "remove", "path": "/spec/template/spec/containers/0/resources/limits"}]' 2>/dev/null || echo "⚠️  No limits to remove or already removed"
        shell: bash

      - name: Inject secrets into KubeSentinel AI deployment
        run: |
          kubectl create secret generic kubesentinel-ai-secrets \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=TRAINING_API_TOKEN="${{ secrets.TRAINING_API_TOKEN }}" \
            -n kubesentinel \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl set env deployment/kubesentinel-ai \
            ENRICH_WITH_GEMINI=true \
            GEMINI_RATE_LIMIT_PER_MINUTE=25 \
            STAGING_DB_PATH=/app/staging.db \
            TRIAGE_POLL_INTERVAL=30 \
            TRIAGE_BATCH_SIZE=10 \
            -n kubesentinel

          kubectl set env deployment/kubesentinel-ai \
            --from=secret/kubesentinel-ai-secrets \
            -n kubesentinel

          echo "=== Waiting for rollout triggered by env injection ==="
          if ! kubectl rollout status deployment/kubesentinel-ai -n kubesentinel --timeout=8m; then
            echo "❌ kubesentinel-ai rollout failed. Dumping diagnostics..."

            echo "--- Deployments / ReplicaSets / Pods ---"
            kubectl get deploy,rs,pods -n kubesentinel -o wide || true

            echo "--- Describe Deployment ---"
            kubectl describe deployment kubesentinel-ai -n kubesentinel || true

            echo "--- Describe ReplicaSets ---"
            kubectl describe rs -n kubesentinel || true

            echo "--- Namespace Events (newest last) ---"
            kubectl get events -n kubesentinel --sort-by=.lastTimestamp | tail -n 80 || true

            POD=$(kubectl get pod -n kubesentinel -l app=kubesentinel-ai \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              echo "--- Describe Pod: $POD ---"
              kubectl describe pod -n kubesentinel "$POD" || true

              echo "--- Pod logs (current, last 200 lines) ---"
              kubectl logs -n kubesentinel "$POD" --all-containers --tail=200 || true

              echo "--- Pod logs (previous container, if any) ---"
              kubectl logs -n kubesentinel "$POD" --all-containers --previous --tail=200 || true
            else
              echo "⚠️  No pod found with label app=kubesentinel-ai"
            fi

            echo "--- Image presence on Minikube node ---"
            minikube ssh "docker images | grep kubesentinel-ai" || true

            exit 1
          fi
          echo "✓ KubeSentinel AI deployment ready"

          echo "=== Configuring Firewall ==="
          sudo ufw allow 30500/tcp || true
          sudo ufw allow 8080/tcp  || true
          echo "✓ Firewall rules applied"

          echo "KubeSentinel AI pod status:"
          kubectl get pods -n kubesentinel -l app=kubesentinel-ai
        shell: bash

      - name: Verify AI service health and staging endpoint
        run: |
          echo "=== Running smoke test on KubeSentinel AI pod ==="
          AI_POD=$(kubectl get pod -n kubesentinel -l app=kubesentinel-ai -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$AI_POD" ]; then
            echo "❌ No AI pod found"
            exit 1
          fi

          PF_LOG=$(mktemp)
          cleanup_port_forward() {
            if [ -n "${PF_PID:-}" ] && kill -0 "$PF_PID" 2>/dev/null; then
              kill "$PF_PID" 2>/dev/null || true
              wait "$PF_PID" 2>/dev/null || true
            fi
            rm -f "$PF_LOG"
          }
          trap cleanup_port_forward EXIT

          echo "Starting port-forward to KubeSentinel AI pod..."
          kubectl port-forward -n kubesentinel "pod/$AI_POD" 5000:5000 --address 127.0.0.1 >"$PF_LOG" 2>&1 &
          PF_PID=$!
          sleep 5

          echo "Checking /health endpoint..."
          curl -sSf http://127.0.0.1:5000/health || { echo "❌ /health failed"; exit 1; }

          echo "Checking /api/staging endpoint..."
          curl -sSf http://127.0.0.1:5000/api/staging || { echo "❌ /api/staging failed"; exit 1; }
          
          echo "✓ AI service health and staging endpoint verified"
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 5. STATIC SECURITY SCANS (Go CLI + Python CSPM)
      # ──────────────────────────────────────────────────────────────────────
      - name: Run KubeSentinel Static Scan (Go CLI)
        run: |
          echo "=== Running KubeSentinel Go static scan on k8s manifests ==="
          REPO_WORKSPACE="$GITHUB_WORKSPACE"

          cd /home/test/kubesentinel
          git pull origin main

          cd "$REPO_WORKSPACE"

          # Copy rules from the kubesentinel repo
          cp -r /home/test/kubesentinel/config ./

          # Create reports directory for all scan outputs
          mkdir -p reports

          set +e
          SCAN_OUTPUT=$(kubesentinel scan --path ./k8s/ 2>&1)
          SCAN_EXIT=$?
          set -e

          echo "$SCAN_OUTPUT" | tee reports/static-scan.json

          if [ $SCAN_EXIT -ne 0 ]; then
            if echo "$SCAN_OUTPUT" | grep -q "invalid yaml in config/rules/build-in-rules.yaml"; then
              echo "⚠️  Malformed rule file detected. Retrying without it..."
              rm -f ./config/rules/build-in-rules.yaml
              set +e
              SCAN_OUTPUT=$(kubesentinel scan --path ./k8s/ 2>&1)
              SCAN_EXIT=$?
              set -e
              echo "$SCAN_OUTPUT" | tee reports/static-scan.json
            elif echo "$SCAN_OUTPUT" | grep -q "Scan completed with violations found"; then
              echo "⚠️  KubeSentinel found policy violations. Will deploy anyway for demo purposes."
            else
              echo "❌ KubeSentinel scan could not run"
              exit 1
            fi
          fi

          if grep -q '"passed": false' reports/static-scan.json; then
            echo "⚠️  KubeSentinel scan found violations in k8s manifests"
            echo "SCAN_FAILED=true" >> $GITHUB_ENV
          else
            echo "✓ KubeSentinel static scan passed — no violations"
            echo "SCAN_FAILED=false" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NEW: Python CSPM module scan (cspm/ directory, added in Phase 1.4)
      - name: Run CSPM Python Scan
        run: |
          echo "=== Running KubeSentinel CSPM Python module ==="
          REPO_WORKSPACE="$GITHUB_WORKSPACE"
          KUBESENTINEL_DIR=/home/test/kubesentinel

          # Install CSPM dependency (pyyaml only, lightweight)
            python3 -m pip install pyyaml --break-system-packages -q 2>/dev/null || \
            python3 -m pip install pyyaml -q 2>/dev/null || true

          cd "$KUBESENTINEL_DIR"

          # JSON findings — machine-readable, used for violation check below
          set +e
            python3 -m cspm.cli \
            --manifest "$REPO_WORKSPACE/k8s/" \
            --format json \
            --output "$REPO_WORKSPACE/reports/cspm-findings.json" \
            --summary
          CSPM_EXIT=$?
          set -e

          # HTML report — visual dashboard uploaded as artifact
            python3 -m cspm.cli \
            --manifest "$REPO_WORKSPACE/k8s/" \
            --format html \
            --output "$REPO_WORKSPACE/reports/cspm-report.html" || true

          echo "=== CSPM Scan Summary ==="
          if [ -f "$REPO_WORKSPACE/reports/cspm-findings.json" ]; then
            # Print severity counts from JSON summary block
            python3 -c "
              import json
              with open('$REPO_WORKSPACE/reports/cspm-findings.json') as f:
                data = json.load(f)
              summary = data.get('summary', {})
              total = summary.get('total', 0)
              print(f'Total findings : {total}')
              for sev in ['CRITICAL','HIGH','MEDIUM','LOW']:
                count = summary.get(sev, 0)
                if count:
                  print(f'  {sev}: {count}')
              if total == 0:
                print('No CSPM findings - manifests look clean')
              else:
                print('Review cspm-report.html for remediation guidance')
              " 2>/dev/null || cat "$REPO_WORKSPACE/reports/cspm-findings.json"

                    # Set env flag if CRITICAL findings exist
                    CRITICAL_COUNT=$(python3 -c "
                  import json
                  with open('$REPO_WORKSPACE/reports/cspm-findings.json') as f:
                      data = json.load(f)
                  print(data.get('summary', {}).get('CRITICAL', 0))
                  " 2>/dev/null || echo "0")

                    echo "CSPM_CRITICAL=$CRITICAL_COUNT" >> $GITHUB_ENV

                    if [ "$CRITICAL_COUNT" -gt 0 ]; then
                      echo "⚠️  CSPM found $CRITICAL_COUNT CRITICAL misconfiguration(s) — review before production"
                    fi
                  else
                    echo "⚠️  CSPM output file not found (check cspm module installation)"
                  fi
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 6. DEPLOY VICTIM APP
      # ──────────────────────────────────────────────────────────────────────
      - name: Ensure demo-app namespace exists
        if: success()
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        shell: bash

      - name: Deploy to Minikube
        if: success()
        run: |
          echo "✓ Deploying victim-app..."
          kubectl apply -f ./k8s/deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f ./k8s/service-loadbalancer.yaml -n ${{ env.NAMESPACE }}
        shell: bash

      - name: Wait for deployment rollout
        if: success()
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=5m
        shell: bash

      - name: Verify pod status
        if: success()
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }}
        shell: bash

      - name: Post-deployment health check
        if: success()
        run: |
          echo "=== Running post-deployment health checks ==="
          kubectl wait --for=condition=ready pod \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=90s

          POD_NAME=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD_NAME" ]; then
            echo "❌ No pods found with label app=${{ env.DEPLOYMENT_NAME }}"
            exit 1
          fi
          echo "✓ Pod: $POD_NAME"

          POD_PHASE=$(kubectl get pod "$POD_NAME" -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.status.phase}')
          echo "✓ Phase: $POD_PHASE"

          if [ "$POD_PHASE" != "Running" ]; then
            echo "❌ Pod is not in Running state"
            exit 1
          fi

          echo "=== Checking /api/health endpoint ==="
          HEALTH_OK=false
          for i in $(seq 1 10); do
            echo "Health check attempt $i/10"
            if kubectl exec "$POD_NAME" -n ${{ env.NAMESPACE }} -- \
              node -e "const http=require('http');const req=http.get('http://localhost:3000/api/health',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));"; then
              HEALTH_OK=true
              break
            fi
            sleep 3
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Health check failed after retries:"
            kubectl logs "$POD_NAME" -n ${{ env.NAMESPACE }} --tail=40 || true
            exit 1
          fi
          echo "✓ Health check passed"
        shell: bash
        continue-on-error: false

      # ──────────────────────────────────────────────────────────────────────
      # 7. KUBESENTINEL POST-DEPLOY CHECKS (new features)
      # ──────────────────────────────────────────────────────────────────────

      # NEW: verify the Prometheus /health and /metrics endpoints
      # that the DaemonSet exposes on port 8080 (--metrics-port=8080)
      - name: Verify KubeSentinel Metrics Endpoint
        if: success()
        run: |
          echo "=== Verifying KubeSentinel Prometheus metrics endpoint ==="

          KSNODE_POD=$(kubectl get pod -n kubesentinel \
            -l app=kubesentinel \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [ -z "$KSNODE_POD" ]; then
            echo "⚠️  No kubesentinel DaemonSet pod found — skipping metrics check"
          else
            echo "KubeSentinel pod: $KSNODE_POD"

            # Health check
            if kubectl exec "$KSNODE_POD" -n kubesentinel -- \
              curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✓ /health endpoint is UP"
            else
              echo "⚠️  /health endpoint not responding yet (monitor may still be warming up)"
            fi

            # Sample key metrics
            echo "=== Sampled Prometheus metrics ==="
            kubectl exec "$KSNODE_POD" -n kubesentinel -- \
              curl -sf http://localhost:8080/metrics 2>/dev/null \
              | grep -E '^kubesentinel_(falco_events_total|anomalies_detected_total|scan_duration)' \
              || echo "⚠️  Metrics not yet populated (no events received)"
          fi
        shell: bash

      # NEW: generate a forensic report using the new `kubesentinel report` command
      # Covers the current pipeline run window (last 24h via REPORT_FROM/REPORT_TO).
      # Outputs markdown + JSON + HTML to reports/ for artifact upload below.
      - name: Generate KubeSentinel Forensic Report
        if: success()
        run: |
          echo "=== Generating KubeSentinel forensic report ==="
          mkdir -p reports

          cd /home/test/kubesentinel

          set +e
          kubesentinel report \
            --from "${{ env.REPORT_FROM }}" \
            --to   "${{ env.REPORT_TO }}" \
            --format markdown,json,html \
            --no-llm \
            2>&1 | tee /tmp/ks-report.log
          REPORT_EXIT=$?
          set -e

          # Copy generated reports to workspace reports/ directory
          if ls /home/test/kubesentinel/reports/*.{md,json,html} 2>/dev/null | head -1 | grep -q .; then
            cp /home/test/kubesentinel/reports/*.md   $GITHUB_WORKSPACE/reports/ 2>/dev/null || true
            cp /home/test/kubesentinel/reports/*.json $GITHUB_WORKSPACE/reports/forensics-report.json 2>/dev/null || true
            cp /home/test/kubesentinel/reports/*.html $GITHUB_WORKSPACE/reports/forensics-report.html 2>/dev/null || true
            echo "✓ Forensic report generated and copied to reports/"
          else
            echo "ℹ️  No forensic records in the report window yet"
            echo "    (This is expected on the first run — incidents accumulate over time)"
            cat /tmp/ks-report.log || true
          fi
        shell: bash

      - name: Verify LoadBalancer Service
        if: success()
        run: |
          echo "=== Checking LoadBalancer Service ==="
          kubectl get svc -n ${{ env.NAMESPACE }} victim-app-lb

          EXTERNAL_IP=$(kubectl get svc -n ${{ env.NAMESPACE }} victim-app-lb \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")

          if [ -z "$EXTERNAL_IP" ]; then
            echo "⚠️  LoadBalancer external IP not yet assigned."
            echo "    Run 'minikube tunnel' on the VM to expose it."
          else
            echo "✓ LoadBalancer external IP: $EXTERNAL_IP"
          fi
        shell: bash

      - name: Display Access Instructions
        if: success()
        run: |
          VM_IP=$(hostname -I | awk '{print $1}')
          VM_HOSTNAME=$(hostname)
          FALCO_POD=$(kubectl get pod -n falco \
            -l app.kubernetes.io/name=falco,app.kubernetes.io/instance=falco \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "falco-pod")
          EXTERNAL_IP=$(kubectl get svc -n ${{ env.NAMESPACE }} victim-app-lb \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "PENDING")
          KS_POD=$(kubectl get pod -n kubesentinel \
            -l app=kubesentinel \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "kubesentinel-pod")

          echo ""
          echo "============================================================"
          echo "      KubeSentinel Demo Setup Complete ✓"
          echo "============================================================"
          echo ""
          echo "📍 VM Details:"
          echo "  Hostname : $VM_HOSTNAME"
          echo "  Network  : $VM_IP"
          echo ""
          echo "☸️  Stack Components:"
          echo "  ✓ KubeSentinel Runtime : kubesentinel namespace"
          echo "  ✓ KubeSentinel AI      : kubesentinel namespace (port 5000)"
          echo "  ✓ Falco                : falco namespace (eBPF + JSON + Falcosidekick)"
          echo "  ✓ Victim App           : ${{ env.NAMESPACE }} namespace"
          echo ""
          echo "🎯 Attack Simulator:"
          echo "  1. On VM:     minikube tunnel"
          echo "  2. Browser:   http://$VM_IP  (or http://$EXTERNAL_IP)"
          echo ""
          echo "📡 Falco events are forwarded automatically by Falcosidekick to:"
          echo "  http://kubesentinel-runtime.kubesentinel.svc.cluster.local:8080/events"
          echo "  (no manual log piping needed)"
          echo ""
          echo "  Optional manual pipe (debug only):"
          echo "  kubectl logs -f -n falco $FALCO_POD \\"
          echo "    | grep --line-buffered '^{' \\"
          echo "    | ./bin/kubesentinel monitor-stdin --config=config.yaml --warmup-minutes=0"
          echo ""
          echo "📊 KubeSentinel Prometheus Metrics:"
          echo "  kubectl exec -n kubesentinel $KS_POD -- curl http://localhost:8080/metrics"
          echo "  kubectl exec -n kubesentinel $KS_POD -- curl http://localhost:8080/health"
          echo ""
          echo "🔬 AI Service Port Forward:"
          echo "  kubectl port-forward --address 0.0.0.0 svc/kubesentinel-ai 30500:5000 -n kubesentinel"
          echo ""
          echo "📝 Reports generated this run:"
          echo "  reports/static-scan.json      — Go CLI static scan"
          echo "  reports/cspm-findings.json    — Python CSPM findings"
          echo "  reports/cspm-report.html      — CSPM visual dashboard"
          echo "  reports/forensics-report.html — Forensic investigation report"
          echo "  reports/forensics-report.json — Forensic report (JSON)"
          echo ""
          echo "  CSPM CRITICAL findings : ${{ env.CSPM_CRITICAL }}"
          echo "  Go static scan passed  : ${{ env.SCAN_FAILED == 'false' && 'YES' || 'NO (violations found)' }}"
          echo ""
          echo "📋 Pipeline Summary:"
          echo "  Image      : ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "  Namespace  : ${{ env.NAMESPACE }}"
          echo "  Deployment : ${{ env.DEPLOYMENT_NAME }}"
          echo "  Commit     : ${{ github.sha }}"
          echo ""
          echo "=== All Pod Status ==="
          kubectl get pods -A
          echo ""
          echo "============================================================"
        shell: bash

      - name: Serve Frontend
        if: success()
        run: |
          VM_IP=$(hostname -I | awk '{print $1}')

          echo "=== Patching API URLs in compiled frontend ==="
          find ~/kubesentinel/frontend -name "*.js" -exec \
            sed -i "s|http://localhost:5000|http://$VM_IP:5000|g" {} \;
          find ~/kubesentinel/frontend -name "*.js" -exec \
            sed -i "s|http://localhost:8080|http://$VM_IP:8080|g" {} \;

          echo "=== Starting frontend server ==="
          fuser -k 3000/tcp || true
          nohup python3 -m http.server 3000 --bind 0.0.0.0 \
            --directory ~/kubesentinel/frontend \
            > /tmp/frontend.log 2>&1 &

          echo "✓ Frontend live at http://$VM_IP:3000"
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # 8. UPLOAD SECURITY REPORTS AS ARTIFACTS
      # ──────────────────────────────────────────────────────────────────────

      # NEW: upload all generated reports (CSPM HTML, forensics, static scan)
      # so they are accessible from the GitHub Actions run summary page.
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubesentinel-security-reports-${{ github.sha }}
          path: |
            reports/static-scan.json
            reports/cspm-findings.json
            reports/cspm-report.html
            reports/forensics-report.html
            reports/forensics-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Workflow summary
        if: always()
        run: |
          echo "=== Workflow Summary ==="
          echo "Image           : ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Namespace       : ${{ env.NAMESPACE }}"
          echo "Deployment      : ${{ env.DEPLOYMENT_NAME }}"
          echo "Commit          : ${{ github.sha }}"
          echo "Static scan     : SCAN_FAILED=${{ env.SCAN_FAILED }}"
          echo "CSPM CRITICAL   : ${{ env.CSPM_CRITICAL }}"
          echo "========================"
        shell: bash